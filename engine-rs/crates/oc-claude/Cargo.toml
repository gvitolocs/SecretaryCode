oc-agent = { workspace = true }
oc-mcp = { workspace = true }
oc-permission = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
globset = "0.4"
regex = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
futures-util = { workspace = true }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
oc-provider = { workspace = true }
oc-store = { workspace = true, default-features = false }
