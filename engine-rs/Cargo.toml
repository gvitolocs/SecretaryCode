[workspace]
resolver = "2"
members = [
    "crates/oc-schema",
    "crates/oc-bus",
    "crates/oc-store",
    "crates/oc-tools",
    "crates/oc-provider",
    "crates/oc-agent",
    "crates/oc-server",
    "crates/oc-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
oc-schema = { path = "crates/oc-schema" }
oc-bus = { path = "crates/oc-bus" }
oc-store = { path = "crates/oc-store" }
oc-tools = { path = "crates/oc-tools" }
oc-provider = { path = "crates/oc-provider" }
oc-agent = { path = "crates/oc-agent" }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = { version = "0.5", features = ["util"] }
futures-util = "0.3"
regex = "1"
base64 = "0.22"
async-trait = "0.1"
oc-permission = { path = "crates/oc-permission" }
