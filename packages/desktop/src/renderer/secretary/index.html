<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Secretary Code · Lucina</title><link rel="stylesheet" href="style.css"></head><body>
<main>
<section id="login" class="login" hidden><div class="brand-orb"><img src="icon.png" alt="Lucina"></div><p class="eyebrow" data-copy="name"></p><h1 data-copy="welcome"></h1><p class="subtle" data-copy="loginDetail"></p><form id="login-form"><label><span data-copy="email"></span><input id="email" type="email" autocomplete="username" required maxlength="254"></label><label><span data-copy="password"></span><input id="password" type="password" autocomplete="current-password" required maxlength="4096"></label><button class="primary" id="login-submit" data-copy="signIn"></button></form><p class="security" data-copy="secure"></p></section>
<section id="companion" hidden><div class="heading"><div><h1 class="lucina-title"><img src="icon.png" alt=""><span data-copy="name"></span></h1><p class="connection"><span id="dot"></span><span id="connection" data-copy="connecting"></span></p></div><div class="heading-actions"><button id="signout" class="text-button" data-copy="signOut" hidden></button><button id="wardrobe-toggle" class="icon-button" data-title="wardrobe" aria-label="Wardrobe">♧</button></div></div><div class="stage-wrap"><iframe id="avatar" src="stage.html" title="Lucina" sandbox="allow-scripts allow-same-origin"></iframe><div id="stage-status" class="stage-status" data-copy="stageLoading"></div><div class="camera-controls"><button data-camera="face" data-copy="face"></button><button data-camera="bust" data-copy="bust"></button><button data-camera="full" data-copy="full"></button><button id="reset" data-title="reset" aria-label="Reset view">↺</button></div><button id="wave" class="wave-button" data-title="gesture"><img src="icon.png" alt=""></button></div><div class="chat-heading"><span data-copy="tagline"></span><div><button id="voice" class="text-button" data-copy="muted"></button><button id="refresh" class="icon-button small" data-title="refresh" aria-label="Refresh conversation">↻</button></div></div><div id="messages" role="log" aria-live="polite"><div class="empty"><p data-copy="empty"></p><span data-copy="emptyDetail"></span></div></div><form id="composer"><textarea id="message" rows="1" maxlength="16000" data-placeholder="composer"></textarea><button id="send" class="send-button" type="submit" data-title="send" aria-label="Send message">↑</button></form></section>
<div id="notice" role="alert" hidden></div>
<aside id="wardrobe" hidden><div class="sheet-heading"><h2 data-copy="appearance"></h2><button id="wardrobe-close" class="icon-button" data-title="close" aria-label="Close">×</button></div><label><span data-copy="outfit"></span><select id="outfit"></select></label><label><span data-copy="hairstyle"></span><select id="hair"></select></label><label><span data-copy="hairColor"></span><select id="hairColor"></select></label><label><span data-copy="background"></span><select id="background"><option value="default" data-copy="stage"></option><option value="color:#101426" data-copy="night"></option><option value="color:#f4f1ec" data-copy="paper"></option><option value="color:#cfe8ff" data-copy="sky"></option></select></label></aside>
</main><script type="module" src="client.mjs"></script></body></html>
